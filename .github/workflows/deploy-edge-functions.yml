# redeploy: 2026-05-05
name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-edge-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          # Pinned: "latest" jumped to 3.0.0, which prompts before production deploys
          version: 3.0.0

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref bzzstdpfmyqttnzhgaoa
          supabase functions deploy spotify-auth --yes
          supabase functions deploy spotify-sync-liked --yes
          supabase functions deploy spotify-unlike-tracks --yes
          supabase functions deploy genre-mapping --yes
          supabase functions deploy ai-track-genre-suggest --yes
          supabase functions deploy discogs-auth --yes
          supabase functions deploy discogs-search --yes
          supabase functions deploy discogs-add-to-collection --yes
          supabase functions deploy discogs-pull-sync --yes
          supabase functions deploy vinyl-image-identify --yes
          supabase functions deploy discogs-genre-mapping --yes
